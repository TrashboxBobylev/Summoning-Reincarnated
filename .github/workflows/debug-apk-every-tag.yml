## 2
name: Upload thing when pushing something (Stable Reincarnated)

on:
  push:
    branches:
      - "!master"
    tags:
      - "ReInc-v0.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK environment to 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 1


      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7.4'

      - name: Parse semver string
        id: semver_parser
        uses: booxmedialtd/ws-action-parse-semver@v1
        with:
          input_string: '${{github.ref}}'
          version_extractor_regex: '\/ReInc-v(.*)$'

      - name: Create dynamic version number
        id: vars
        shell: bash
        run: |
          echo "version="Reincarnated-${{steps.semver_parser.outputs.fullversion}}"" >> $GITHUB_ENV
          echo "Reincarnated-${{steps.semver_parser.outputs.fullversion}}" > version

      - name: Configure Keystore
        run: |
          echo "$ANDROID_KEYSTORE_FILE" > keystore.jks.b64
          base64 -d -i keystore.jks.b64 > android/keystore.jks
          echo "storeFile=keystore.jks" >> keystore.properties
          echo "keyAlias=$KEYSTORE_KEY_ALIAS" >> keystore.properties
          echo "storePassword=$KEYSTORE_STORE_PASSWORD" >> keystore.properties
          echo "keyPassword=$KEYSTORE_KEY_PASSWORD" >> keystore.properties
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.GOOGLEPLAY_SIGNING_KEYSTORE }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.GOOGLEPLAY_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.GOOGLEPLAY_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.GOOGLEPLAY_STORE_PASSWORD }}

      # 2
      - name: Generate Release APK
        run: ./gradlew android:assembleRelease
      - name: Generate Release JAR
        run: ./gradlew desktop:release
      # 3
      - name: Get Build Tool Version
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        # ID used to access action output
        id: sign_app
        with:
          releaseDirectory: android/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: Rename APK
        run: mv android/build/outputs/apk/release/android-release-signed.apk android/build/outputs/apk/release/android-release.apk

      - name: Remove signing key
        run: rm android/build/outputs/apk/release/signingKey.jks

      - name: Upload as Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ github.ref_name }}"
          prerelease: false
          title: "${{ env.version }}"
          files: |
            android/build/outputs/apk/release/android-release.apk
            desktop/build/libs/*.jar

      - name: Cache Ruby - Bundler
        uses: actions/cache@v3
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Grant Permission to Execute
        run: chmod +x gradlew

      - name: Install bundle
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Create Google Play Config file
        run: |
          echo "$PLAY_CONFIG_JSON" > play_config.json.b64
          base64 -d -i play_config.json.b64 > play_config.json
        env:
          PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}

      - name: Distribute app to Production 🚀
        run: bundle exec fastlane production

